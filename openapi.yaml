openapi: 3.0.4
info:
  title: Cities Lookup
  description: >-
    Cities Lookup is a city search API that searches over 150,000 global cities
    to find country codes, population counts, and city size classifications by
    name, with an optional country filter. Paid plans add region codes, capital
    status, GeoJSON coordinates and custom match limits.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/citieslookup:
    get:
      summary: Cities Lookup
      description: Lookup city data based on the city name, optionally filtered by country
      operationId: citieslookup
      parameters:
        - name: city
          in: query
          schema:
            type: string
          required: true
          description: The city name for which you want to get the data (e.g., New York)
          example: San Francisco
        - name: country
          in: query
          schema:
            type: string
          required: false
          description: >-
            Two-letter ISO country code to restrict matches to one country
            (e.g., US)
          example: US
        - name: limit
          in: query
          schema:
            type: integer
          required: false
          description: Limit number of cities that match your search criteria
          example: 5
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  search: San Francisco
                  foundCities:
                    - name: San Francisco
                      altName: ''
                      country: US
                      featureCode: PPLA2
                      population: 864816
                      loc:
                        type: Point
                        coordinates:
                          - -122.41942
                          - 37.77493
                      regionCode: CA
                      countryName: United States
                      populationCategory: large
                      isCapital: false
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
